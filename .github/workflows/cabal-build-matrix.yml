name: Cabal Build Matrix

on:
  push:
    branches:
      - "*"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GHC_VERSION: "9.14.1"
  CABAL_VERSION: "latest"

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Github runners:
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - os: linux
            arch: amd64
            runs_on: ubuntu-latest
          - os: linux
            arch: arm64
            runs_on: ubuntu-24.04-arm
          - os: windows
            arch: amd64
            runs_on: windows-latest
          - os: windows
            arch: arm64
            runs_on: windows-11-arm
          - os: macos
            arch: amd64
            runs_on: macos-26-intel
          - os: macos
            arch: arm64
            runs_on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Haskell with Cabal
        if: ${{ !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC_VERSION }}
          cabal-version: ${{ env.CABAL_VERSION }}

      # `haskell-actions/setup` (and ghcup itself) doesn't support Windows ARM64 -
      # neither GHC nor cabal-install publish native aarch64-windows bindists either.
      # Windows 11 on ARM transparently emulates x86_64 binaries, so as a fallback we
      # download the official x86_64-windows bindists directly and run those instead.
      # Logs:
      # > Error: Unable to locate executable file: ghcup.
      # > Please verify either the file path exists or the file can be found within a directory specified by the PATH environment variable.
      # > Also verify the file has a valid extension for an executable file.
      - name: Install GHC and Cabal (Windows ARM64 fallback)
        if: ${{ matrix.os == 'windows' && matrix.arch == 'arm64' }}
        shell: pwsh
        env:
          CABAL_FALLBACK_VERSION: "3.16.0.0" # GHC 9.14 requires cabal-install >= 3.16.0.0
        run: |
          $ghcUrl = "https://downloads.haskell.org/~ghc/${{ env.GHC_VERSION }}/ghc-${{ env.GHC_VERSION }}-x86_64-unknown-mingw32.tar.xz"
          Invoke-WebRequest -Uri $ghcUrl -OutFile ghc.tar.xz
          New-Item -ItemType Directory -Path C:\ghc | Out-Null
          tar -xf ghc.tar.xz -C C:\ghc --strip-components=1

          $cabalUrl = "https://downloads.haskell.org/~cabal/cabal-install-$env:CABAL_FALLBACK_VERSION/cabal-install-$env:CABAL_FALLBACK_VERSION-x86_64-windows.zip"
          Invoke-WebRequest -Uri $cabalUrl -OutFile cabal.zip
          New-Item -ItemType Directory -Path C:\cabal | Out-Null
          Expand-Archive -Path cabal.zip -DestinationPath C:\cabal

          Add-Content -Path $env:GITHUB_PATH -Value "C:\ghc\bin"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\cabal"

          $env:PATH = "C:\ghc\bin;C:\cabal;$env:PATH"
          ghc --version
          cabal --version

      - name: Resolve Cabal cache paths
        id: cabal-paths
        shell: pwsh
        run: |
          $cabalStore = cabal path --output-format=key-value | Select-String '^store-dir:' | ForEach-Object { $_.ToString() -replace '^store-dir:\s*', '' }
          "cabal_store=$cabalStore" >> $env:GITHUB_OUTPUT

      - name: Update Cabal package index
        run: cabal update

      - name: Restore Cabal cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.cabal-paths.outputs.cabal_store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.arch }}-cabal-${{ hashFiles('cabal.project', 'cabal.project.freeze', 'lsp-xreferee.cabal') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-cabal-

      - name: Build with Cabal
        run: cabal build exe:lsp-xreferee --ghc-options="-O2 -Werror"

      - name: Copy binary artifact
        shell: bash
        run: |
          mkdir -p dist-bin
          bin="$(cabal list-bin exe:lsp-xreferee)"
          cp "$bin" dist-bin/

      - name: Compress binary artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -C dist-bin -czf dist-bin/lsp-xreferee-${{ matrix.os }}-${{ matrix.arch }}.tar.gz lsp-xreferee

      - name: Compress binary artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist-bin/lsp-xreferee.exe -DestinationPath dist-bin/lsp-xreferee-${{ matrix.os }}-${{ matrix.arch }}.zip -Force

      - name: Upload compressed artifact (Unix)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: lsp-xreferee-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-bin/lsp-xreferee-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

      - name: Upload compressed artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: lsp-xreferee-${{ matrix.os }}-${{ matrix.arch }}
          path: dist-bin/lsp-xreferee-${{ matrix.os }}-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/*
          generate_release_notes: true
